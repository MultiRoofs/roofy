name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Fetch plugin submodule
        run: git submodule update --init --recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install app dependencies
        run: npm ci

      # AFTER npm ci, always: npm rewrites the linked packages' node_modules
      # and destroys pnpm's workspace links (CLAUDE.md).
      - name: Install plugin workspace dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
        working-directory: packages/cityjson-navara-plugins

      - name: Build
        run: npm run build
        env:
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}
          # Not a secret: the GA measurement ID ships in the page source, so a
          # repository variable (Settings → Variables) is the right scope.
          # dotenvx run does not overwrite vars already in the environment, so
          # this reaches vite.config.ts / import.meta.env unchanged.
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
