<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      as="image"
      href="/brand/roofy-lockup-animated-light.svg"
    />
    <style>
      #launch-screen {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        align-content: center;
        place-items: center;
        gap: 24px;
        padding: 24px;
        background: #fff;
        opacity: 1;
        transition: opacity 180ms ease-out;
      }
      #launch-screen img {
        width: 360px;
        max-width: 65vw;
        height: auto;
      }
      #launch-screen .launch-tagline {
        margin: 0;
        max-width: 100%;
        color: #5c636e;
        font-family: "Source Sans 3", system-ui, sans-serif;
        font-size: clamp(0.75rem, 3.5vw, 1.5rem);
        font-weight: 500;
        line-height: 1.35;
        text-align: center;
        white-space: nowrap;
      }
      #launch-screen .launch-tagline-mask {
        display: block;
        overflow: hidden;
      }
      #launch-screen .launch-tagline-line {
        display: block;
        animation: launch-tagline-reveal 750ms cubic-bezier(0.16, 1, 0.3, 1) 2s
          both;
      }
      @keyframes launch-tagline-reveal {
        from {
          transform: translateY(105%);
        }
        to {
          transform: translateY(0);
        }
      }
      #launch-screen.launch-screen--leaving {
        opacity: 0;
        pointer-events: none;
      }
      #root[aria-hidden="true"] {
        visibility: hidden;
      }
      @media (prefers-reduced-motion: reduce) {
        #launch-screen {
          transition: none;
        }
        #launch-screen .launch-tagline-line {
          animation: none;
        }
      }
    </style>
    <title>Roofy — 3D city viewer & rooftop analyser</title>
  </head>
  <body>
    <div id="launch-screen" role="status" aria-label="Loading Roofy">
      <img
        src="/brand/roofy-lockup-animated-light.svg"
        width="432"
        height="128"
        alt="Roofy"
      />
      <p class="launch-tagline">
        <span class="launch-tagline-mask">
          <span class="launch-tagline-line"
            >Discover your city’s rooftop potential</span
          >
        </span>
      </p>
    </div>
    <div id="root" inert aria-hidden="true"></div>
    <noscript
      ><style>
        #launch-screen {
          display: none;
        }</style
      >Roofy needs JavaScript to open city models. Please enable it and
      reload.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
