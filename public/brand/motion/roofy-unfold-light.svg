<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -4 64 64" width="192" height="192" role="img" aria-labelledby="title desc">
<title id="title">Roofy — Open possibilities</title><desc id="desc">The four colored planes expand from their meeting edges into the finished mark. Plays once and holds the original logo.</desc>
<style>g,path,rect{animation-timing-function:cubic-bezier(.16,1,.3,1)!important}.water{transform-origin:24px 39px;animation:slab 2s both}.nature{transform-origin:24px 29px;animation:plane 2s both}.social{transform-origin:24px 29px;animation:plane2 2s both}.energy{transform-origin:24px 20px;animation:sun 2s both}
@keyframes slab{0%{transform:scaleX(0)}25%,100%{transform:scaleX(1)}}
@keyframes plane{0%,10%{transform:scaleX(0)}60%,100%{transform:scaleX(1)}}
@keyframes plane2{0%,22%{transform:scaleX(0)}72%,100%{transform:scaleX(1)}}
@keyframes sun{0%,40%{transform:scaleY(0)}90%,100%{transform:scaleY(1)}}
@media(prefers-reduced-motion:reduce){.mark,.water,.nature,.social,.energy{animation:none!important}}</style>
<g class="mark"><path class="nature" d="M24 8 L24 29 L3 29 Z" fill="#7CB518"/>
<path class="energy" d="M24 8 L36 20 L24 20 Z" fill="#F0A800"/>
<path class="social" d="M24 20 L36 20 L45 29 L24 29 Z" fill="#D9481C"/>
<rect class="water" x="3" y="34" width="42" height="10" rx="2.5" fill="#1E5FD8"/></g></svg>